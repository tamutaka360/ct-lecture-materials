hor="middle">12本</text></g><rect x="70" y="130" width="1090" height="150" fill="none" class="ax"/><rect id="hl" x="70" y="118" width="182" height="174" fill="none" stroke="#C62828" stroke-width="4" style="display:none"/><text class="t" x="70" y="360">② その落ち方をグラフにしたものが MTF</text><line x1="300" y1="530" x2="940" y2="530" class="ax"/><line x1="300" y1="380" x2="300" y2="530" class="ax"/><text class="l" x="620.0" y="564" text-anchor="middle">空間周波数（縞の細かさ）→</text><text class="l" x="284" y="455.0" text-anchor="middle" transform="rotate(-90 284 455.0)">MTF</text><text class="l" x="254" y="388">1.0</text><text class="l" x="270" y="536">0</text><line id="seg2" x1="396.0" y1="395.1" x2="492.0" y2="420.2" stroke="#1565C0" stroke-width="4" stroke-linecap="round" style="display:none"/><line id="seg3" x1="492.0" y1="420.2" x2="588.0" y2="454.9" stroke="#1565C0" stroke-width="4" stroke-linecap="round" style="display:none"/><line id="seg4" x1="588.0" y1="454.9" x2="684.0" y2="487.4" stroke="#1565C0" stroke-width="4" stroke-linecap="round" style="display:none"/><line id="seg5" x1="684.0" y1="487.4" x2="780.0" y2="510.2" stroke="#1565C0" stroke-width="4" stroke-linecap="round" style="display:none"/><line id="seg6" x1="780.0" y1="510.2" x2="876.0" y2="522.6" stroke="#1565C0" stroke-width="4" stroke-linecap="round" style="display:none"/><circle id="pt1" cx="396.0" cy="395.1" r="9" fill="#1565C0" stroke="#fff" stroke-width="2.5" style="display:none"/><circle id="pt2" cx="492.0" cy="420.2" r="9" fill="#1565C0" stroke="#fff" stroke-width="2.5" style="display:none"/><circle id="pt3" cx="588.0" cy="454.9" r="9" fill="#1565C0" stroke="#fff" stroke-width="2.5" style="display:none"/><circle id="pt4" cx="684.0" cy="487.4" r="9" fill="#1565C0" stroke="#fff" stroke-width="2.5" style="display:none"/><circle id="pt5" cx="780.0" cy="510.2" r="9" fill="#1565C0" stroke="#fff" stroke-width="2.5" style="display:none"/><circle id="pt6" cx="876.0" cy="522.6" r="9" fill="#1565C0" stroke="#fff" stroke-width="2.5" style="display:none"/><text class="s" id="rd1" x="1000" y="424" style="display:none;fill:#C62828"></text><text class="s" id="rd2" x="1000" y="454" style="display:none;fill:#C62828"></text><g id="end" style="display:none"><text class="hint" x="960" y="520">ここで縞は消える</text><text class="s" x="620" y="618" text-anchor="middle">MTF＝1 なら濃淡がそのまま伝わる。0 なら、その細かさの構造は画像から消えてしまう。</text></g><rect x="0" y="0" width="1240" height="640" fill="transparent" id="hit"/>
<script type="text/javascript"><![CDATA[
var NS = 6, GAP = 181.67, BX = 70;
var RD = [[2,0.9443],[4,0.7683],[6,0.5257],[8,0.2979],[10,0.1383],[12,0.0521]];
var step = 0;
function show(id, on){ var e=document.getElementById(id); if(e) e.style.display = on?'inline':'none'; }
function render(){
  for(var i=1;i<=NS;i++){ show('bar'+i, step>=i); show('pt'+i, step>=i); }
  for(var i=2;i<=NS;i++){ show('seg'+i, step>=i); }
  var cur = Math.min(step, NS);
  show('hl', step>=1 && step<=NS);
  if(step>=1 && step<=NS){
    document.getElementById('hl').setAttribute('x', (BX+(cur-1)*GAP).toFixed(0));
    document.getElementById('rd1').textContent = '縞 '+RD[cur-1][0]+'本';
    document.getElementById('rd2').textContent = 'MTF = '+RD[cur-1][1].toFixed(2);
    show('rd1',true); show('rd2',true);
  } else { show('rd1',false); show('rd2',false); }
  show('end', step>NS);
  document.getElementById('stepno').textContent = step+' / '+(NS+1);
  document.getElementById('guide').textContent =
    (step>NS) ? 'クリックで最初から ↺' : 'クリックで進む ▶';
}
function advance(d){ step = (step + d + (NS+2)) % (NS+2); render(); }
var ROOT = document.getElementById('mtffig');
(ROOT || document).addEventListener('click', function(){ advance(1); });
window.mtfStep = function(d){ advance(d); };
window.mtfReset = function(){ step = 0; render(); };
document.addEventListener('keydown', function(e){
  if(e.key===' '||e.key==='ArrowRight'||e.key==='Enter'){ e.preventDefault(); advance(1); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); advance(-1); }
  else if(e.key==='Home'){ e.preventDefault(); step=0; render(); }
});
render();
]]></script>
</svg>