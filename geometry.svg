</style><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#374151"/></marker></defs><rect width="1240" height="600" fill="#ffffff"/><text class="t" x="60" y="48">なぜ中心と辺縁で「ボケ方」が違うのか</text><rect x="630" y="54" width="140" height="50" rx="8" fill="#374151"/><text class="s" x="782" y="88">X線管</text><line x1="645" y1="110" x2="755" y2="110" stroke="#C62828" stroke-width="8"/><text class="s" x="782" y="120" fill="#C62828">焦点の幅 wF（大きい）</text><rect x="180" y="500" width="1000" height="30" rx="6" fill="#9AA3AD"/><rect x="683" y="500" width="34" height="30" fill="#1565C0"/><text class="s" x="760" y="556" fill="#1565C0">検出器1素子の開口幅 wD（小さい）</text><polygon points="645,110 755,110 717,500 683,500" fill="#F6C9C9" opacity="0.55" stroke="#E39C9C"/><line x1="200" y1="305" x2="1160" y2="305" stroke="#CBD2DA" stroke-width="2" stroke-dasharray="8 6"/><circle cx="700" cy="305" r="7" fill="#111827"/><text class="s" x="718" y="291">回転中心</text><line stroke="#2E7D32" stroke-width="9" stroke-linecap="round" x1="645" x2="755" y1="170" y2="170"><animate attributeName="x1" values="650.8;652.2;653.5;654.8;656.1;657.4;658.7;660.1;661.4;662.7;664.0;665.3;666.6;667.9;669.3;670.6;671.9;673.2;674.5;675.8;677.2;677.2;675.8;674.5;673.2;671.9;670.6;669.3;667.9;666.6;665.3;664.0;662.7;661.4;660.1;658.7;657.4;656.1;654.8;653.5;652.2;650.8" dur="8.0s" repeatCount="indefinite"/><animate attributeName="x2" values="749.2;747.8;746.5;745.2;743.9;742.6;741.3;739.9;738.6;737.3;736.0;734.7;733.4;732.1;730.7;729.4;728.1;726.8;725.5;724.2;722.8;722.8;724.2;725.5;726.8;728.1;729.4;730.7;732.1;733.4;734.7;736.0;737.3;738.6;739.9;741.3;742.6;743.9;745.2;746.5;747.8;749.2" dur="8.0s" repeatCount="indefinite"/><animate attributeName="y1" values="170.0;183.5;197.0;210.5;224.0;237.5;251.0;264.5;278.0;291.5;305.0;318.5;332.0;345.5;359.0;372.5;386.0;399.5;413.0;426.5;440.0;440.0;426.5;413.0;399.5;386.0;372.5;359.0;345.5;332.0;318.5;305.0;291.5;278.0;264.5;251.0;237.5;224.0;210.5;197.0;183.5;170.0" dur="8.0s" repeatCount="indefinite"/><animate attributeName="y2" values="170.0;183.5;197.0;210.5;224.0;237.5;251.0;264.5;278.0;291.5;305.0;318.5;332.0;345.5;359.0;372.5;386.0;399.5;413.0;426.5;440.0;440.0;426.5;413.0;399.5;386.0;372.5;359.0;345.5;332.0;318.5;305.0;291.5;278.0;264.5;251.0;237.5;224.0;210.5;197.0;183.5;170.0" dur="8.0s" repeatCount="indefinite"/></line><text class="s" x="820" y="176" fill="#2E7D32">この緑の長さ＝その場所でのボケの大きさ<animate attributeName="y" values="170.0;183.5;197.0;210.5;224.0;237.5;251.0;264.5;278.0;291.5;305.0;318.5;332.0;345.5;359.0;372.5;386.0;399.5;413.0;426.5;440.0;440.0;426.5;413.0;399.5;386.0;372.5;359.0;345.5;332.0;318.5;305.0;291.5;278.0;264.5;251.0;237.5;224.0;210.5;197.0;183.5;170.0" dur="8.0s" repeatCount="indefinite"/></text><text class="s" x="60" y="150">焦点に近い（＝辺縁）ほど</text><text class="s" x="60" y="182">焦点の大きさがそのまま効いて太くなる</text><text class="s" x="60" y="240">検出器に近い（＝反対側の辺縁）ほど</text><text class="s" x="60" y="272">検出器の開口幅が効いて細くなる</text><text class="s" x="60" y="336" fill="#C62828">→ 場所によってボケの大きさが違う</text><text class="s" x="60" y="368" fill="#C62828">　 ＝ 分解能は同心円状に変化する</text><text class="s" x="60" y="576">wF と wD の比が場所ごとに変わるので、画像の中心と端では分解能が同じにならない。</text></svg>